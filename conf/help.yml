# SGA 自定义帮助文件 — 所有可配置项说明
# 通过 python main.py help 查看

usage: |
  用法:
    python main.py                             使用 conf/config.yaml 中的配置运行
    python main.py <key>=<value> ...           覆盖配置项（Hydra 语法）
    python main.py help                        显示此帮助信息

  示例:
    python main.py gse_id=GSE123456 analysis_mode=diff
    python main.py analysis_mode=hilo tar_gene=APEX1 strict_filter=false
    python main.py analysis_mode=enrich enrichment_source_mode=diff

sections:
  # ── 必需参数 ─────────────────────────────────────────────
  - title: "必需参数"
    fields:
      - key: tar_gene
        type: string
        default: （与 multi_gene 二选一）
        desc: |
          目标基因符号（大写），如 APEX1、TP53、TGFB1。
          与 multi_gene 互斥，只能保留其中一个。

      - key: multi_gene
        type: string
        default: '"" （与 multi_gene 二选一）'
        desc: |
          多基因输入。支持两种格式：
          1) 逗号分隔：multi_gene="APEX1,TP53,TGFB1"
          2) 文件路径：multi_gene="./my_genes.txt"（每行一个基因，# 开头为注释）
          与 tar_gene 互斥，只能保留其中一个。
          目前 immune 模式生成 N×22 免疫热图，diff/hilo 模式生成每基因一张箱线图。

      - key: gse_id
        type: string
        default: （无默认值，必填）
        desc: "GEO 数据集 accession，如 GSE143318、GSE55747"

  # ── 核心设置 ─────────────────────────────────────────────
  - title: "核心设置"
    fields:
      - key: analysis_mode
        type: string
        default: diff
        choices: [corr, diff, hilo, enrich, immune]
        desc: |
          corr   — 相关性分析：目标基因与其他基因的 Pearson 相关
          diff   — 差异分析：Control vs Experiment 组间 Welch's t-test + FDR 校正
          hilo   — 高低表达分析：按目标基因中位表达分成 High/Low 组后差异比较
          enrich — 富集分析：对 diff/hilo 结果做 KEGG/GO 通路富集（需要先运行 diff/hilo）
          immune — 免疫浸润分析：用去卷积算法（TumorDecon）估算 22 种免疫细胞丰度

      - key: version
        type: string
        default: "1.3"
        desc: "配置文件版本号，仅供信息参考"

  # ── 分组设置 ── diff 模式 ──────────────────────────────
  - title: "分组设置（仅 diff 模式使用）"
    fields:
      - key: group_select_col
        type: string (或 null)
        default: source_name_ch1
        desc: |
          GEO 元数据中用于分组的列名。设为 null 直接进入交互式分组。
          常见列名：source_name_ch1（来源描述）、characteristics_ch1（样本特征）、title（标题）

      - key: control_label
        type: 字符串列表
        default: ["control"]
        desc: "在 group_select_col 列中识别 Control 组的关键词（不区分大小写，子串匹配）"

      - key: exp_label
        type: 字符串列表
        default: ["CCl4"]
        desc: "在 group_select_col 列中识别实验组的关键词（不区分大小写，子串匹配）"

      - key: exp_type
        type: string
        default: Fibrosis
        desc: "实验组的显示名称，如 Fibrosis、Tumor、Treatment。用于结果标签和图表标题"

  # ── 分组记忆 ─────────────────────────────────────────────
  - title: "分组记忆"
    fields:
      - key: group_memory_enabled
        type: boolean
        default: false
        desc: "是否在交互式分组完成后保存选择到 conf/group_memory.yaml"

      - key: group_memory_use
        type: boolean
        default: false
        desc: "是否从 conf/group_memory.yaml 读取并自动应用之前保存的分组（跳过交互式提示）"
        note: "若记忆的列名/分组值在当前元数据中不存在，会自动回退到交互式选择"

  # ── 统计过滤 ─────────────────────────────────────────────
  - title: "统计过滤"
    fields:
      - key: p_threshold
        type: float
        default: 0.05
        desc: "显著性阈值（用于 padj 或 P_value 过滤，取决于 strict_filter）"

      - key: strict_filter
        type: boolean
        default: true
        desc: |
          true  — 严格模式：按 padj（FDR 校正后）< p_threshold 过滤
          false — 宽松模式：按 P_value（未校正）< p_threshold
                   且 |log2FC| > log2fc_threshold 过滤

      - key: log2fc_threshold
        type: float
        default: 0.5
        desc: |
          最小绝对 log2 倍数变化。用于：
          - strict_filter=false 时的过滤条件之一
          - 富集分析输入基因的筛选

      - key: max_output_genes
        type: integer
        default: 0
        desc: "diff/hilo 结果保留的最大基因数（按显著程度排序）。0 = 不限制"

      - key: signs
        type: 字符串列表
        default: ["positive", "negative"]
        desc: "corr 模式：保留哪些符号的相关性（positive=正相关, negative=负相关）"

  # ── 基因黑名单 ───────────────────────────────────────────
  - title: "基因过滤"
    fields:
      - key: gene_blacklist
        type: 字符串列表
        default: []
        desc: "从结果中排除的基因名称列表（不区分大小写，精确匹配）。如无法被正则模式覆盖的 lncRNA 等"

  # ── 富集分析 ── enrich 模式 ──────────────────────────────
  - title: "富集分析（仅 enrich 模式使用）"
    fields:
      - key: enrichment_source_mode
        type: string
        default: diff
        choices: [diff, hilo]
        desc: "富集分析的输入来源：diff = 差异分析结果，hilo = 高低表达分析结果"

      - key: enrichment_gene_sets
        type: 字符串列表
        default:
          - KEGG_2026
          - GO_Biological_Process_2025
          - GO_Molecular_Function_2025
          - GO_Cellular_Component_2025
        desc: |
          Enrichr 基因集库列表。可通过 python -c "import gseapy; print(gseapy.get_library_name())" 查看所有可用库

      - key: organism
        type: string
        default: human
        desc: "物种名称，用于 Enrichr API 查询。常用值：human、mouse、rat"

      - key: max_input_genes
        type: integer
        default: 500
        desc: "提交给 Enrichr 的最大基因数。Enrichr API 有输入大小限制，过大会超时"

  # ── 免疫浸润 ── immune 模式 ──────────────────────────────
  - title: "免疫浸润分析（仅 immune 模式使用）"
    fields:
      - key: immune_method
        type: string
        default: DeconRNASeq
        choices: [DeconRNASeq, CIBERSORT, ssGSEA, SingScore]
        desc: |
          去卷积算法。DeconRNASeq（最小二乘，速度快，默认推荐）。
          CIBERSORT 使用 NuSVR，每个样本需 10-30 秒但精度更高。

  # ── 流程控制 ─────────────────────────────────────────────
  - title: "流程控制与输出"
    fields:
      - key: process
        type: string
        default: "123"
        desc: |
          流程阶段控制（数字组合）：
          1 = 数据下载与清洗
          2 = 分析计算
          3 = 绘图输出
          如只画图：process=3；完整流程：process=123（默认）

      - key: overwrite_figures
        type: boolean
        default: false
        desc: |
          false — 不覆盖已有图片，自动迭代编号（如 boxplot (1).png）
          true  — 直接覆盖已有图片

  # ── 调试与存储 ───────────────────────────────────────────
  - title: "调试与存储"
    fields:
      - key: data_dir
        type: string
        default: data
        desc: "数据存储根目录（相对于项目根目录）"

      - key: storage
        type: boolean
        default: true
        desc: "是否将分析结果保存为 pkl + csv 文件"

      - key: debug
        type: boolean
        default: false
        desc: |
          true  — 调试模式：跳过缓存，强制重新下载数据和重新计算
          false — 正常模式：若缓存文件存在则直接读取

      - key: strict_mode
        type: boolean
        default: false
        desc: "是否将表达矩阵对齐到仅共享样本（更严格的矩阵匹配）"

      - key: log_threshold
        type: integer
        default: 10
        desc: "判断数据是否已经 log2 转换的阈值。表达矩阵最大值 ≤ 该值时视为已转换，跳过 log2(x+1)"

  # ── Hydra 日志 ───────────────────────────────────────────
  - title: "Hydra 日志"
    fields:
      - key: hydra.job_logging.handlers.console.level
        type: string
        default: INFO
        choices: [DEBUG, INFO, WARNING, ERROR]
        desc: "控制台日志级别"
